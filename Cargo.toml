[package]
name = "ocr-translate"
version = "0.2.0"
edition = "2021"
description = "Screen OCR + LLM/translation-API popup tool for Linux (X11 & Wayland)"
license = "MIT"

[[bin]]
name = "ocr-translate"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rust-ini = "0.21"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
image = "0.25"
leptess = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
global-hotkey = "0.6"
# Pinned: 0.9+ made Monitor::x()/y()/width()/height() call an internal Wayland
# scale-factor lookup that hangs indefinitely on at least this project's
# KDE/KWin setup. See CLAUDE.md before bumping this.
xcap = "0.0.14"
tray-icon = { version = "0.19", default-features = false }
x11rb = "0.13"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
# wayland-data-control: without it, arboard silently uses its X11 backend
# even under Wayland (WAYLAND_DISPLAY set), which can't see what a
# Wayland-native tool like `wl-copy` placed on the clipboard — confirmed by
# testing the `external` capture backend.
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = "0.4"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
opt-level = 2
strip = true
