# ocr-translate configuration (INI-style .conf)
#
# Copy to $XDG_CONFIG_HOME/ocr-translation/config.conf (usually ~/.config/ocr-translation/config.conf)
# or generate this file directly with: ocr-translate init-config --format conf

active_provider = lmstudio

; If active_provider fails (server not running, bad key, network error, ...),
; these are tried next, in order. The default below means: prefer your local
; LM Studio, then fall back to Google's free public endpoint (no key needed)
; — so the app still works even with nothing else configured. (Bing has no
; equivalent free option — see [provider.bing] below — so it isn't listed
; here by default; add it once you've set mode = private + a real Azure key.)
fallback_providers = google

[general]
target_lang = en
source_lang = auto
log_level = info

[ocr]
languages = eng
psm = 6
preprocess = true

[capture]
; built_in: grab the active monitor ourselves and crop it with our own
;           zoom/pan/select window. Portable across every Wayland desktop.
; external: run external_command and let IT do the region selection (a real
;           live overlay on your actual desktop), then read the image it
;           leaves on the clipboard. Nicer where available, but depends on a
;           specific tool being installed, so it isn't the default — we don't
;           know which desktop environment you're running.
backend = built_in
; Only used when backend = external. Must leave a PNG image on the clipboard
; when it's done. Examples:
;   KDE:      spectacle -r -b -c
;   wlroots:  grim -g "$(slurp)" - | wl-copy
;   GNOME:    gnome-screenshot -a -c
external_command = spectacle -r -b -c
; How long to keep polling the clipboard for an image after the command exits.
external_timeout_secs = 10

; The in-app crop-selector window — "drag a rectangle to select" — shown by
; both `ocr-translate capture` (built_in backend) and `watch-region`'s
; initial region pick. width/height are the box the screenshot is initially
; scaled to fit within (aspect ratio preserved); scroll to zoom in further
; from there. Doesn't need to match your monitor's resolution.
[popup]
width = 1600
height = 1600
always_on_top = true

; Shared by every window that shows a translation result: the one-shot
; capture popup, Live Clipboard Translate, and Live Region Translate.
; auto_close_secs only takes effect on the one-shot capture popup — the Live
; Clipboard/Region windows ignore it, since they're meant to keep running
; (and updating in place) until you close them yourself.
[translate]
width = 520
height = 380
font_size = 16
always_on_top = true
; Auto-dismiss the one-shot capture popup after N seconds; 0 = stay open
; until closed.
auto_close_secs = 0

; Popup shown when reopening a history entry (tray History submenu /
; `ocr-translate show-history`) — separate from [translate] above so you can
; size it differently than the live capture-result popup, e.g. larger for
; comfortably re-reading older entries.
[history_popup]
width = 520
height = 380
font_size = 16
always_on_top = true
auto_close_secs = 0

[history]
; Record each successful translation to history.jsonl next to this file.
enabled = true
; Oldest entries beyond this are trimmed after each capture.
max_entries = 50
; How many of the most recent entries to list in the tray's History submenu.
tray_menu_entries = 5

; Tray's "Live Clipboard Translate": watches the clipboard and shows a
; live-updating popup — copy something, see it translated; copy something
; else, it updates in place. Never recorded to history.
[live_translate]
; Initial state of the popup's "Show source" checkbox; changeable per-session.
show_source_by_default = true
; How often to check whether the clipboard's text changed.
poll_interval_ms = 500

; Tray's "Live Region Translate": pick a fixed screen region once (via a
; PipeWire ScreenCast session), then keep OCR-ing that region and
; re-translating whenever the recognized text changes. Never recorded to
; history. Requires the xdg-desktop-portal ScreenCast backend.
[region_translate]
; Initial state of the popup's "Show source" checkbox; changeable per-session.
show_source_by_default = true
; How often to grab the latest frame, OCR the region, and re-translate if the
; text changed. OCR is much more expensive than the clipboard's plain
; text-change check, so this defaults slower than live_translate's.
poll_interval_ms = 1000
; How long to wait after the ScreenCast portal negotiation succeeds before
; grabbing the frame used for region selection. The compositor's own "share
; screen with..." picker dialog can still be visible in the first frame or
; two otherwise. Raise this if your compositor is slower to dismiss the picker.
capture_delay_secs = 1

[prompt]
system = You are a precise translation engine. Translate the user's text and reply with ONLY the translation, no notes, no quotes, no explanations.
template = Translate the following text from {source_lang} to {target_lang}:\n\n{text}

; Each translation backend is its own [provider.<name>] section.
; `kind` is one of: openai_compatible | google_translate | bing_translate
; `mode` (google_translate / bing_translate only) is public | private

[provider.lmstudio]
kind = openai_compatible
base_url = http://localhost:1234/v1
model = local-model
; LM Studio can optionally require an API key (Settings -> Developer ->
; Local Server -> Request Queuing / API key). Leave blank to not send one.
api_key =

[provider.ollama]
kind = openai_compatible
base_url = http://localhost:11434/v1
model = llama3.1

[provider.openai]
kind = openai_compatible
base_url = https://api.openai.com/v1
api_key_env = OPENAI_API_KEY
model = gpt-4o-mini

; DeepSeek's hosted API (OpenAI-compatible). Unlike Google/Bing below,
; DeepSeek has no free/public unauthenticated endpoint to fall back to — it's
; a paid (or trial-credit) LLM API, always requiring api_key_env.
[provider.deepseek]
kind = openai_compatible
base_url = https://api.deepseek.com/v1
api_key_env = DEEPSEEK_API_KEY
model = deepseek-chat

; mode = public: the free, unofficial endpoint translate.google.com's own
; page uses. No API key, no billing, no prompt sent (it's a real translation
; API, not an LLM). Undocumented and could change or rate-limit without notice.
; For mode = private instead, use the official Cloud Translation API v2:
; uncomment "mode = private" and "api_key_env = GOOGLE_TRANSLATE_API_KEY".
[provider.google]
kind = google_translate
mode = public
; mode = private
; api_key_env = GOOGLE_TRANSLATE_API_KEY

; Unlike Google above, there's no reliable free public option here — the
; unofficial trick bing.com/translator used is now either dead or actively
; blocked by anti-bot protection (confirmed by testing), so mode = public
; just returns an error explaining that. Use the official Azure Translator
; v3 API instead: needs api_key_env (+ region for multi-service resources).
[provider.bing]
kind = bing_translate
mode = private
api_key_env = AZURE_TRANSLATOR_KEY
region =
