# ocr-translate configuration (INI-style .conf)
#
# Copy to $XDG_CONFIG_HOME/ocr-translate/config.conf (usually ~/.config/ocr-translate/config.conf)
# or generate this file directly with: ocr-translate init-config --format conf

active_provider = lmstudio

[general]
target_lang = en
source_lang = auto
log_level = info

[ocr]
languages = eng
psm = 6
preprocess = true

[hotkey]
capture_region = CTRL+ALT+O
enable_portal = true
enable_x11 = true

[popup]
width = 520
height = 380
font_size = 16
always_on_top = true
auto_close_secs = 0

[prompt]
system = You are a precise translation engine. Translate the user's text and reply with ONLY the translation, no notes, no quotes, no explanations.
template = Translate the following text from {source_lang} to {target_lang}:\n\n{text}

; Each translation backend is its own [provider.<name>] section.
; `kind` is one of: openai_compatible | google_translate | bing_translate

[provider.lmstudio]
kind = openai_compatible
base_url = http://localhost:1234/v1
model = local-model

[provider.ollama]
kind = openai_compatible
base_url = http://localhost:11434/v1
model = llama3.1

[provider.openai]
kind = openai_compatible
base_url = https://api.openai.com/v1
api_key_env = OPENAI_API_KEY
model = gpt-4o-mini

[provider.deepseek]
kind = openai_compatible
base_url = https://api.deepseek.com/v1
api_key_env = DEEPSEEK_API_KEY
model = deepseek-chat

[provider.google]
kind = google_translate
api_key_env = GOOGLE_TRANSLATE_API_KEY

[provider.bing]
kind = bing_translate
api_key_env = AZURE_TRANSLATOR_KEY
