name: Release

# Push a tag like "v0.2.0" to trigger this. It builds the Linux release
# binary, packages it into a tarball, and opens a DRAFT GitHub Release with
# auto-generated notes (from commits/PRs since the last tag) and the tarball
# attached. Nothing is published automatically — review the draft on the
# repo's Releases page and click "Publish release" when it's ready.
#
# Linux-only for now: this is the only platform actually verified to build
# and run correctly (see CLAUDE.md). Don't add Windows/macOS jobs without
# verifying the build — several dependencies here (ashpd, x11rb, the GTK tray
# backend) are Linux-specific in practice even where they happen to compile
# elsewhere.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libtesseract-dev libleptonica-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="ocr-translate-${VERSION}-x86_64-linux"
          mkdir -p "$DIST"
          cp target/release/ocr-translate "$DIST/"
          cp README.md LICENSE "$DIST/"
          cp -r config "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          echo "asset_tarball=${DIST}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "asset_checksum=${DIST}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset_tarball }}
            ${{ steps.package.outputs.asset_checksum }}
