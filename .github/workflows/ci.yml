name: CI

# Runs on every push/PR — unlike release.yml (tag-triggered, Linux-only,
# packages a real release artifact), this is a fast build-only check across
# platforms. Its main job right now is Windows: development happens on Linux
# with no Windows/macOS machine available, so this is the actual "does the
# Windows-specific capture backend (src/capture/windows_backend.rs, xcap)
# compile for real" signal — see TODO.md. Don't fold this into release.yml
# or start packaging Windows artifacts until this has been green for a
# while and someone's actually run the resulting binary on real Windows.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libtesseract-dev libleptonica-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

  build-windows:
    runs-on: windows-latest
    # `leptess` (OCR, used on every platform, not just Linux) needs
    # Tesseract+Leptonica, discovered via vcpkg on Windows (see leptess's own
    # README) rather than pkg-config — windows-latest runners ship vcpkg
    # pre-installed at $env:VCPKG_INSTALLATION_ROOT, so this just installs
    # the one port into it rather than bootstrapping vcpkg itself.
    env:
      VCPKGRS_DYNAMIC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tesseract via vcpkg
        run: vcpkg install tesseract:x64-windows

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked
