name: Autobuild

# Runs on every push to main — covers both a direct push and a PR merge,
# since merging a PR into main is itself a push to main. Builds the release
# binary for both Linux and Windows, packages each into an archive, and
# creates a fresh DRAFT GitHub Release (tagged v<Cargo.toml version>-<run
# number>, so every run gets its own release instead of overwriting the
# same one) with both archives attached. Nothing is published automatically
# — review the draft on the repo's Releases page and click "Publish
# release" when ready.
#
# The tag includes the run number, not just the version, so two pushes
# without a version bump in between still each get their own release
# instead of colliding on the same tag (confirmed happening — every build
# was stacking onto one "latest" release before this).
#
# Windows is packaged and attached here too, but newer and less proven than
# Linux — see CLAUDE.md/TODO.md. `release-windows` runs after `release-linux`
# (not in parallel) so the two don't race updating the same release, and
# only `release-linux` sets `generate_release_notes` — running that twice
# risks duplicate/conflicting notes.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libtesseract-dev libleptonica-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          DIST="ocr-translate-${VERSION}-x86_64-linux"
          mkdir -p "$DIST"
          cp target/release/ocr-translate "$DIST/"
          # Distro Tesseract packages don't necessarily include trained
          # language data either — bundle the languages config.example.yaml's
          # ocr.languages defaults to (jpn+eng+jpn_vert) so the app works
          # with zero manual setup — jpn_vert is a separate trained model
          # for vertical Japanese text (manga and similar), not just a psm
          # setting, see config.example.yaml. src/ocr.rs's
          # bundled_tessdata_dir() looks for this exact "tessdata" folder
          # next to the binary as a fallback when ocr.tessdata_dir isn't
          # set in config.
          mkdir -p "$DIST/tessdata"
          curl -sSL -o "$DIST/tessdata/eng.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          curl -sSL -o "$DIST/tessdata/jpn.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn.traineddata
          curl -sSL -o "$DIST/tessdata/jpn_vert.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn_vert.traineddata
          cp README.md LICENSE "$DIST/"
          cp -r config "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_tarball=${DIST}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "asset_checksum=${DIST}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.package.outputs.version }} (build ${{ github.run_number }})
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset_tarball }}
            ${{ steps.package.outputs.asset_checksum }}

  release-windows:
    needs: release-linux
    runs-on: windows-latest
    # `leptess` (OCR, used on every platform, not just Linux) needs
    # Tesseract+Leptonica, discovered via vcpkg on Windows (see leptess's own
    # README) rather than pkg-config — windows-latest runners ship vcpkg
    # pre-installed at $env:VCPKG_INSTALLATION_ROOT, so this just installs
    # the one port into it rather than bootstrapping vcpkg itself. The
    # `vcpkg` Rust crate (used by leptonica-sys/tesseract-sys's build.rs)
    # specifically needs VCPKG_ROOT set — `VCPKG_INSTALLATION_ROOT` (the
    # runner-preset var) and `VCPKG_ROOT` (what the crate actually reads) are
    # not the same variable, so this has to be bridged explicitly via
    # $GITHUB_ENV rather than assumed.
    env:
      VCPKGRS_DYNAMIC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Point VCPKG_ROOT at the runner's pre-installed vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # vcpkg already writes a binary cache to a local folder by default (no
      # extra vcpkg config needed) — `VCPKG_DEFAULT_BINARY_CACHE` just pins
      # that folder to a known path so actions/cache can persist it across
      # runs. This is what actually avoids recompiling Tesseract/Leptonica
      # (and their own dependencies: libpng, zlib, libjpeg-turbo, libtiff,
      # openjp2, ...) from source on every run — vcpkg's own GitHub Actions
      # binary-cache provider (`x-gha`) that older docs/examples reference
      # has since been removed from vcpkg, so this (default local cache +
      # the CI's native cache action) is the current recommended approach.
      # A cache miss (e.g. the very first run, or after a vcpkg/tesseract
      # version bump) just means a slow rebuild same as today — never a
      # correctness risk, since vcpkg keys reuse on its own ABI hash
      # (compiler, port script, triplet, etc.), not on this cache key alone.
      - name: Point vcpkg's binary cache at a known folder
        run: echo "VCPKG_DEFAULT_BINARY_CACHE=${{ runner.temp }}\vcpkg-cache" >> $env:GITHUB_ENV

      - name: Create vcpkg binary cache folder
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-archives-windows-tesseract-${{ github.run_id }}
          restore-keys: |
            vcpkg-archives-windows-tesseract-

      - name: Install Tesseract via vcpkg
        run: vcpkg install tesseract:x64-windows

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' -List).Matches[0].Groups[1].Value
          $dist = "ocr-translate-$version-x86_64-windows"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item target/release/ocr-translate.exe $dist/
          # Tesseract/Leptonica are linked dynamically (VCPKGRS_DYNAMIC=true
          # above), so the exe needs these DLLs alongside it at runtime.
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" $dist/
          # vcpkg's tesseract port ships the OCR engine but not trained
          # language data — bundle the languages config.example.yaml's
          # ocr.languages defaults to (jpn+eng+jpn_vert) so the app works
          # with zero manual setup — jpn_vert is a separate trained model
          # for vertical Japanese text (manga and similar), not just a psm
          # setting, see config.example.yaml. src/ocr.rs's
          # bundled_tessdata_dir() looks for this exact "tessdata" folder
          # next to the exe as a fallback when ocr.tessdata_dir isn't set
          # in config.
          New-Item -ItemType Directory -Path "$dist/tessdata" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata" -OutFile "$dist/tessdata/eng.traineddata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn.traineddata" -OutFile "$dist/tessdata/jpn.traineddata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/jpn_vert.traineddata" -OutFile "$dist/tessdata/jpn_vert.traineddata"
          Copy-Item README.md,LICENSE $dist/
          Copy-Item -Recurse config "$dist/config"
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          $hash = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dist.zip" | Set-Content -NoNewline "$dist.zip.sha256"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "asset_zip=$dist.zip" >> $env:GITHUB_OUTPUT
          echo "asset_checksum=$dist.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Attach to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package.outputs.version }}-${{ github.run_number }}
          name: v${{ steps.package.outputs.version }} (build ${{ github.run_number }})
          draft: true
          files: |
            ${{ steps.package.outputs.asset_zip }}
            ${{ steps.package.outputs.asset_checksum }}
