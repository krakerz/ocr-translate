name: Autobuild

# Push a version tag (v*.*.*) to trigger this. It builds the release binary
# for both Linux and Windows, packages each into an archive, and opens a
# single DRAFT GitHub Release with auto-generated notes (from commits/PRs
# since the last tag) and both archives attached. Nothing is published
# automatically — review the draft on the repo's Releases page and click
# "Publish release" when ready.
#
# Release-only, intentionally: no push/PR-triggered build-check jobs here —
# an earlier version of this workflow had those (to catch Windows breakage
# early), but `build-windows` alone was taking 30+ minutes per run (vcpkg's
# Tesseract install is slow), too expensive to pay on every commit.
#
# Windows is real here (packaged and attached), but **still less proven than
# Linux** — see CLAUDE.md/TODO.md: it's only been confirmed to *compile* via
# this workflow and in isolation (a throwaway scratch crate testing just
# `xcap`/`windows_backend.rs`), not confirmed on real hardware to actually
# produce correct screenshots. `release-windows` runs after `release-linux`
# (not in parallel) so the two don't race creating/updating the same
# release, and only `release-linux` sets `generate_release_notes` — running
# that twice against the same tag risks duplicate/conflicting notes.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang libclang-dev \
            libtesseract-dev libleptonica-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            libpipewire-0.3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST="ocr-translate-${VERSION}-x86_64-linux"
          mkdir -p "$DIST"
          cp target/release/ocr-translate "$DIST/"
          cp README.md LICENSE "$DIST/"
          cp -r config "$DIST/"
          tar czf "${DIST}.tar.gz" "$DIST"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"
          echo "asset_tarball=${DIST}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "asset_checksum=${DIST}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset_tarball }}
            ${{ steps.package.outputs.asset_checksum }}

  release-windows:
    needs: release-linux
    runs-on: windows-latest
    # `leptess` (OCR, used on every platform, not just Linux) needs
    # Tesseract+Leptonica, discovered via vcpkg on Windows (see leptess's own
    # README) rather than pkg-config — windows-latest runners ship vcpkg
    # pre-installed at $env:VCPKG_INSTALLATION_ROOT, so this just installs
    # the one port into it rather than bootstrapping vcpkg itself. The
    # `vcpkg` Rust crate (used by leptonica-sys/tesseract-sys's build.rs)
    # specifically needs VCPKG_ROOT set — confirmed by testing (real Windows
    # machine) that without it, the build fails with
    # `VcpkgNotFound("No vcpkg installation found...")` even with vcpkg
    # itself present and on PATH; `VCPKG_INSTALLATION_ROOT` (the runner-preset
    # var) and `VCPKG_ROOT` (what the crate actually reads) are not the same
    # variable, so this has to be bridged explicitly via $GITHUB_ENV rather
    # than assumed.
    env:
      VCPKGRS_DYNAMIC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point VCPKG_ROOT at the runner's pre-installed vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Tesseract via vcpkg
        run: vcpkg install tesseract:x64-windows

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dist = "ocr-translate-$version-x86_64-windows"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item target/release/ocr-translate.exe $dist/
          # Tesseract/Leptonica are linked dynamically (VCPKGRS_DYNAMIC=true
          # above), so the exe needs these DLLs alongside it at runtime —
          # confirmed by testing: without them, launching the exe fails with
          # "tesseract55.dll was not found" even though the build succeeded.
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" $dist/
          Copy-Item README.md,LICENSE $dist/
          Copy-Item -Recurse config "$dist/config"
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          $hash = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dist.zip" | Set-Content -NoNewline "$dist.zip.sha256"
          echo "asset_zip=$dist.zip" >> $env:GITHUB_OUTPUT
          echo "asset_checksum=$dist.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ steps.package.outputs.asset_zip }}
            ${{ steps.package.outputs.asset_checksum }}
